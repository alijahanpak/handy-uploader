name: Release

on:
  push:
    branches:
      - master
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Build library
        run: npm run build

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      # npm uses OIDC first and only falls back to NPM_TOKEN if no trusted
      # publisher is configured, so the token below is a temporary fallback.
      # See https://docs.npmjs.com/trusted-publishers
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
